[package]
name = "disk-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
sha2 = "0.10"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
lzo = { version = "=0.1.4", default-features = false }
zstd = "0.13"
btrfs-transaction = "=0.13.0"
btrfs-disk = "=0.13.0"

[dev-dependencies]
fatfs = "=0.3.6"
