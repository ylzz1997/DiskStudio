[package]
name = "diskstudio"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
png = "0.18.1"
tiff = "0.11.3"
tauri = { version = "2", features = [] }
disk-core = { path = "../crates/disk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3.55"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
miniz_oxide = "0.8.9"
crc32fast = "1.5.5"
quick-xml = "0.42.0"
sha2 = "0.10"
md-5 = "0.10.6"
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["alloc"] }
uuid = { version = "1", features = ["v4", "serde"] }
ntfs = { path = "../vendor/ntfs" }
ext4-view = { path = "../vendor/ext4-view", default-features = false }
zstd = "0.13"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
regf = "=0.3.0"
rfd = { version = "0.15", default-features = false }
rust_xlsxwriter = { version = "0.103.0", default-features = false }

[target.'cfg(windows)'.dependencies]
zip = { version = "9.8.1", default-features = false }
windows = { version = "0.62.2", features = ["Data_Pdf", "Graphics_Imaging", "Storage_Streams", "Win32_System_WinRT"] }
windows-future = "0.3.2"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
winapi = { version = "0.3.9", features = ["vsbackup", "vss", "vsserror", "combaseapi", "objbase"] }
wmi = "0.18.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography"] }
